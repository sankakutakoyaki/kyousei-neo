<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/no-sidebar}">
<body>
    <main layout:fragment="content">
        <section class="input-prompt">
            <form id="ai-form">
                <div class="flex-area">
                    <input class="normal-input"
                        type="text"
                        name="question"
                        placeholder="質問を入力してください" />
                    <button class="normal-btn" type="submit"><span>質問</span></button>
                </div>
            </form>
            <div id="answer-area"></div>
        </section>
        <nav class="shortcut-grid" aria-label="管理メニュー">
            <button type="button" class="shortcut-card" sec:authorize="hasAnyAuthority('APPROLE_office')"
                data-link="/timeworks" data-target="body">
                <img th:src="@{/icons/clock2.png}" alt=""><span>勤怠</span>
            </button>
        </nav>
    </main>
</body>

</html>
