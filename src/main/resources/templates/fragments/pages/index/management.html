<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/with-sidebar}">

<body>
    <div layout:fragment="sidebar-content">
        <div th:replace="~{fragments/common/menu :: managementFragment}"></div>
    </div>
    <main class="normal-body shortcut-page" layout:fragment="content">
        <h1>管理</h1>
        <nav class="shortcut-grid" aria-label="管理メニュー">
            <button type="button" class="shortcut-card" sec:authorize="!hasAnyAuthority('APPROLE_office')" data-link="/timeworks" data-target="body">
                <img th:src="@{/icons/clock2.png}" alt=""><span>勤怠</span>
            </button>
<button type="button" class="shortcut-card"  data-link="/qualifications" data-target="body"><img th:src="@{/icons/person.png}" alt=""><span>資格管理</span></button>
<button type="button" class="shortcut-card" sec:authorize="hasAnyAuthority('APPROLE_admin','APPROLE_master')" data-link="/labor" data-target="body"><img th:src="@{/icons/person.png}" alt=""><span>労務情報</span></button>
<button type="button" class="shortcut-card" sec:authorize="hasAnyAuthority('APPROLE_admin','APPROLE_master')" data-link="/health-checks" data-target="body"><img th:src="@{/icons/person.png}" alt=""><span>健康診断</span></button>
        </nav>
        <div id="form-dialog-area"></div>
        <div id="dialog-area"></div>
    </main>
</body>

</html>
