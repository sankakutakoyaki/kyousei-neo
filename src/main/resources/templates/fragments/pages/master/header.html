<th:block th:fragment="headerFragment(suffix)">
    <div th:id="${'header-' + suffix}" class="flex-area page-input-header">
        <div>
            <th:block th:replace="~{fragments/table/header :: searchBoxFragment(${'search-box-' + suffix})}"></th:block>
            <th:block th:replace="~{fragments/table/header :: kebabBtnsFragment(${
                {
                    'add': 'add-btn-' + suffix,
                    'form': 'form-' + suffix,
                    'delete': 'delete-btn-' + suffix,
                    'download': 'download-btn-' + suffix,
                    'reload': 'reload-btn-' + suffix
                }}
            )}"></th:block>
        </div>
    </div>
</th:block>
