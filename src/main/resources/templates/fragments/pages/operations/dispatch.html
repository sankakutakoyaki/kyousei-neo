<main th:fragment="content" class="normal-body operations-page" data-page="/js/pages/operations/dispatchPage.js" data-css="/css/pages/operations.css" th:attr="data-operations-editor=${opMobileEditor},data-order-id=${opOrderId}">
 <div class="tab-area"><ul class="tab-menu"><li class="tab-menu-item is-active">伝票への割当</li><li class="tab-menu-item" data-link="/daily-crews" data-target="body">日別編成</li></ul>
 <div class="tab-panel is-show"><div class="table-area operation-table">
  <form id="plan-search" class="operation-search page-input-header">
   <label class="form-parts">運行日<input type="date" class="normal-input" id="plan-day" name="workDate" required></label>
   <label class="form-parts">担当営業所<select id="plan-office" name="ownOfficeId" class="normal-select"></select></label>
   <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${ {'text':'検索','id':'plan-keyword','name':'keyword','type':'search'} })}"></th:block>
   <label><input type="checkbox" name="unassigned">未配車のみ</label>
   <button class="normal-btn ok" type="submit">検索</button>
  </form>
  <p class="operation-guide">日別編成の登録後、車両と伝票を結び付けます。1伝票に複数台を追加できます。</p>
  <section id="dispatch-board" aria-label="車両と伝票の配車">
   <p id="plan-instructions" class="operation-guide" role="status">伝票と車両をドラッグ＆ドロップ、または両方の「選択」ボタンで指定してください。最後に確認画面で保存します。</p>
   <div class="dispatch-board-columns">
    <section class="dispatch-pane" data-controller="dispatchVehicles"><h2>車両一覧</h2>
     <section th:replace="~{fragments/table/body :: normalFragment('plan-vehicle-heading','plan-vehicle-rows')}"></section>
     <footer th:replace="~{fragments/table/footer :: datetimeFragment('plan-vehicle-count')}"></footer>
    </section>
    <section class="dispatch-pane" data-controller="operationDispatch"><h2>当日の伝票一覧</h2>
     <section th:replace="~{fragments/table/body :: normalFragment('plan-order-heading','plan-order-rows')}"></section>
     <footer th:replace="~{fragments/table/footer :: datetimeFragment('plan-order-count')}"></footer>
    </section>
   </div>
  </section>
  <p id="plan-status" role="status" class="operation-guide"></p>
 </div></div></div>
 <div id="form-dialog-area"><form id="operation-dispatch-form" class="form-dialog none" data-controller="operationDispatch" data-key="id"><div class="dialog-main">
  <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title':'車両の配車・現場責任者'} })}"></header>
  <section class="dialog-content">
   <p id="plan-summary"></p><p id="plan-readonly"></p>
   <div id="plan-fields"><div class="operation-search"><label>車両コード<input type="text" class="normal-input" id="plan-vehicle-code" autocomplete="off"></label><button type="button" class="normal-btn" id="plan-add">車両を追加</button></div>
    <div id="plan-vehicles"></div>
    <label>現場責任者の担当者コード<input id="plan-leader-code" class="normal-input" type="text" autocomplete="off"></label><p id="plan-leader-name"></p>
   </div>
   <details><summary>変更履歴</summary><div id="plan-history"></div></details>
   <details><summary>旧方式の担当者記録（参照）</summary><div id="plan-legacy"></div></details>
  </section>
  <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ {'footerId':'plan-footer','submitText':'保存','cancelText':'閉じる'} })}"></footer>
 </div></form></div>
 <div id="msg-dialog-area"><div th:replace="~{fragments/dialog/content :: messageFragment}"></div></div>
</main>
