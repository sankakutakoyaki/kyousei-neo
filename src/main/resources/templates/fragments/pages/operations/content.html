<main th:fragment="content" class="normal-body operations-page" data-page="/js/pages/operations/operationPage.js" data-css="/css/pages/operations.css"
 th:attr="data-op-view=${opView},data-op-entity=${opEntity},data-op-write=${opCanWrite},data-op-private=${opPrivate},data-operations-editor=${opMobileEditor}">
 <div class="tab-area">
  <ul class="tab-menu">
   <th:block th:if="${opEntity=='VEHICLE' or opEntity=='INSPECTION'}">
    <li class="tab-menu-item" th:classappend="${opEntity=='VEHICLE'} ? 'is-active'" data-link="/vehicles" data-target="body">車両一覧</li>
    <li class="tab-menu-item" th:classappend="${opEntity=='INSPECTION'} ? 'is-active'" data-link="/vehicle-maintenance" data-target="body">点検予定・実施履歴</li>
   </th:block>
   <th:block th:if="${opEntity=='CREW'}">
    <li class="tab-menu-item" data-link="/dispatch" data-target="body">伝票への割当</li>
    <li class="tab-menu-item is-active" data-link="/daily-crews" data-target="body">日別編成</li>
   </th:block>
   <li th:if="${opEntity=='QUALIFICATION'}" class="tab-menu-item is-active">保有資格一覧</li>
   <th:block th:if="${opEntity=='LABOR' or opEntity=='HEALTH'}">
    <li class="tab-menu-item" th:classappend="${opEntity=='LABOR'} ? 'is-active'" data-link="/labor" data-target="body">保険・年金</li>
    <li class="tab-menu-item" th:classappend="${opEntity=='HEALTH'} ? 'is-active'" data-link="/health-checks" data-target="body">健康診断</li>
   </th:block>
   <li th:if="${opEntity=='SCORE' or opEntity=='QUALIFICATION_TYPE'}" class="tab-menu-item is-active" th:text="${opTitle}"></li>
  </ul>
  <div class="tab-panel is-show"><div class="table-area operation-table">
   <header th:replace="~{fragments/pages/operations/header :: headerFragment}"></header>
   <p id="operation-guide" class="operation-guide"></p>
   <section th:replace="~{fragments/table/body :: normalFragment('operation-heading','operation-rows')}"></section>
   <footer th:replace="~{fragments/table/footer :: datetimeFragment('operation-status')}"></footer>
  </div></div>
 </div>
 <div id="form-dialog-area"><form id="operation-form" class="form-dialog none" data-controller="operations" data-key="id">
  <div class="dialog-main">
   <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title':opTitle} })}"></header>
   <section th:replace="~{fragments/pages/operations/form :: formFragment}"></section>
   <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ {'footerId':'operation-footer','submitText':'保存','cancelText':'閉じる'} })}"></footer>
  </div>
 </form></div>
 <div id="msg-dialog-area"><div th:replace="~{fragments/dialog/content :: messageFragment}"></div></div>
</main>
