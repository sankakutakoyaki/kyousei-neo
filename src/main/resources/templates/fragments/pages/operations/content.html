<main th:fragment="content" class="normal-body operations-page" data-page="/js/pages/operations/operationPage.js" data-css="/css/pages/operations.css"
 th:attr="data-op-entity=${opEntity},data-op-write=${opCanWrite},data-op-private=${opPrivate},data-operations-editor=${opMobileEditor}">
 <div class="tab-area">
  <ul class="tab-menu"><li class="tab-menu-item is-active" th:text="${opTitle}"></li>
   <li th:if="${opSection=='運行'}" class="tab-menu-item" data-link="/vehicles" data-target="body">車両</li>
   <li th:if="${opSection=='運行'}" class="tab-menu-item" data-link="/vehicle-maintenance" data-target="body">点検</li>
   <li th:if="${opSection=='管理'}" class="tab-menu-item" data-link="/qualifications" data-target="body">資格管理</li>
   <li th:if="${opSection=='管理' and opPrivate}" class="tab-menu-item" data-link="/labor" data-target="body">労務情報</li>
   <li th:if="${opSection=='管理' and opPrivate}" class="tab-menu-item" data-link="/health-checks" data-target="body">健康診断</li>
  </ul>
  <div class="tab-panel is-show"><div class="table-area operation-table">
   <header th:replace="~{fragments/pages/operations/header :: headerFragment}"></header>
   <p id="operation-guide" class="operation-guide"></p>
   <section th:replace="~{fragments/table/body :: normalFragment('operation-heading','operation-rows')}"></section>
   <footer th:replace="~{fragments/table/footer :: datetimeFragment('operation-status')}"></footer>
  </div></div>
 </div>
 <div id="form-dialog-area"><form id="operation-form" class="form-dialog none" data-controller="operations" data-key="id">
  <div class="dialog-main">
   <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title':opTitle} })}"></header>
   <section th:replace="~{fragments/pages/operations/form :: formFragment}"></section>
   <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ {'footerId':'operation-footer','submitText':'保存','cancelText':'閉じる'} })}"></footer>
  </div>
 </form></div>
 <div id="msg-dialog-area"><div th:replace="~{fragments/dialog/content :: messageFragment}"></div></div>
</main>
