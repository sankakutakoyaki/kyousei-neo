<main th:fragment="content"
      class="normal-body" 
      data-page="/js/pages/operations/vehicle/vehiclePage.js"
      data-css="/css/pages/operations/vehicle.css">
    <div class="table-area" data-controller="vehicle">
        <header th:replace="~{fragments/pages/operations/vehicle/header :: header01Fragment()}"></header>
        <section th:replace="~{fragments/table/body :: normalFragment('table-header-01', 'table-01')}"></section>
        <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-01')}"></footer>
    </div>
<div id="form-dialog-area">

    <form id="form-01"
          class="form-dialog none"
          data-controller="vehicle"
          data-key="vehicle-id">
        <div class="dialog-main">
            <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '車両登録'} })}"></header>
            <section th:replace="~{fragments/pages/operations/vehicle/form :: form01Fragment()}"></section>
            <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ { 'footerId':'form-footer-01' } })}"></footer>
        </div>
    </form>
</div>
    <div id="msg-dialog-area">
        <div th:replace="~{fragments/dialog/content :: messageFragment}"></div>
    </div>
</main>
