<th:block th:fragment="form01Fragment()">
    <div class="dialog-content" data-enterfocus="form-01">
        <!-- 営業所 -->
        <div class="form-row">
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': '営業所',
                    'combo': 'officeComboList',
                    'top': '-----',
                    'key': 'office-id',
                    'name': 'office-id',
                    'index': 1
                }
            })}"></th:block>
        </div>
        <!-- 車種・メーカー・型式 -->
        <div class="flex-area form-row">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '車種',
                    'name': 'vehicle-name',
                    'placeholder': '例）ハイエース',
                    'index': 2
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': 'メーカー',
                    'name': 'manufacturer',
                    'placeholder': '例）トヨタ',
                    'index': 3
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '型式',
                    'name': 'model-code',
                    'index': 4
                }
            })}"></th:block>
        </div>
        <!-- 車番 -->
        <div class="flex-area form-row">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '車番',
                    'name': 'registration-area',
                    'placeholder': '大阪',
                    'index': 5
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '',
                    'name': 'registration-class',
                    'placeholder': '100',
                    'index': 6
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '',
                    'name': 'registration-kana',
                    'placeholder': 'あ',
                    'index': 7
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '',
                    'name': 'registration-number',
                    'placeholder': '1234',
                    'index': 8
                }
            })}"></th:block>
        </div>

        <!-- 初年度登録 -->
        <!-- 車高・最大積載量 -->
        <div class="flex-area form-row">
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': '初年度登録',
                    'id': 'vehicle-first-registration-year',
                    'name': 'first-registration-year',
                    'index': 9
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': '',
                    'id': 'vehicle-first-registration-month',
                    'name': 'first-registration-month',
                    'index': 10
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '車高',
                    'name': 'vehicle-height',
                    'inputmode': 'numeric',
                    'index': 15,
                    'format': 'currency',
                    'validate': 'number'
                }
            })}"></th:block>
            <span>mm</span>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '最大積載量',
                    'name': 'maximum-load',
                    'inputmode': 'numeric',
                    'index': 16,
                    'format': 'currency',
                    'validate': 'number'
                }
            })}"></th:block>
            <span>kg</span>
        </div>
        <!-- 車検期限・ミッション -->
        <div class="flex-area form-row">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '車検期限',
                    'name': 'inspection-expiration-date',
                    'type': 'date',
                    'index': 11
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': 'ミッション',
                    'name': 'transmission',
                    'combo': 'transmissionComboList',
                    'index': 12
                }
            })}"></th:block>
        </div>
        <!-- タイヤ -->
        <div class="flex-area form-row">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '前輪タイヤ',
                    'name': 'front-tire-size',
                    'placeholder': '例）195/80R15',
                    'index': 13
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '後輪タイヤ',
                    'name': 'rear-tire-size',
                    'placeholder': '例）195/80R15',
                    'index': 14
                }
            })}"></th:block>
        </div>
        <!-- 備考 -->
        <div class="form-row">
            <th:block th:replace="~{fragments/components/box :: textareaFragment(${
                {
                    'text': '備考',
                    'name': 'remarks',
                    'index': 17
                }
            })}"></th:block>
        </div>
        <!-- 基本配車設定：車両登録フォームへ統合 -->
        <div class="form-row">
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': '基本配車区分',
                    'id': 'vehicle-dispatch-category',
                    'combo': 'dispatchCategoryComboList',
                    'index': 18
                }
            })}"></th:block>
        </div>

        <!-- 基本乗務員 -->
        <div class="form-row"
            data-resolve="query"
            data-query-id="employeeResolve"
            data-param-builder="employeeParams"
            data-result-first="true"
            data-name-key="fullName"
            data-value-key="employeeId">

            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '社員ID / コード',
                    'id': 'vehicle-member-code',
                    'resolveId': true,
                    'index': 19
                }
            })}"></th:block>

            <input type="hidden"
                id="vehicle-member-employee-id"
                data-role="hidden-id">

            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text': '社員名',
                    'id': 'vehicle-member-name',
                    'resolveName': true,
                    'readonly': true,
                    'index': 20
                }
            })}"></th:block>

            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text': '役割',
                    'id': 'vehicle-member-role',
                    'combo': 'crewRoleComboList',
                    'index': 21
                }
            })}"></th:block>

            <div class="form-parts">
                <label></label>
                <button type="button"
                        id="vehicle-member-add-btn"
                        class="normal-btn">追加</button>
            </div>
        </div>

        <!-- 登録済み基本乗務員一覧 -->
        <div id="vehicle-form-member-area" class="form-row"></div>
    </div>
</th:block>
