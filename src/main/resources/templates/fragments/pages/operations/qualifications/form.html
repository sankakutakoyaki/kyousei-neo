<th:block th:fragment="form01Fragment()">
    <div class="dialog-content">
        <!-- 項目の移動はform-row単位で行い、id・name・keyは維持してください。 -->
        <div id="operation-fields" class="operation-fields">
            <!-- 担当者コード -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '担当者コード',
                        'id': 'op-employeeCode',
                        'name': 'employee-code',
                        'key': 'employeeCode',
                        'type': 'text',
                        'required': '担当者コードを入力してください。'
                    }
                })}"></th:block>
            </div>
            <!-- 資格コード -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '資格コード',
                        'id': 'op-qualificationCode',
                        'name': 'qualification-code',
                        'key': 'qualificationCode',
                        'type': 'text',
                        'required': '資格コードを入力してください。'
                    }
                })}"></th:block>
            </div>
            <!-- 取得・受講日 -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '取得・受講日',
                        'id': 'op-acquiredDate',
                        'name': 'acquired-date',
                        'key': 'acquiredDate',
                        'type': 'date',
                        'required': '取得・受講日を入力してください。'
                    }
                })}"></th:block>
            </div>
            <!-- 有効期限 -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '有効期限',
                        'id': 'op-expiryDate',
                        'name': 'expiry-date',
                        'key': 'expiryDate',
                        'type': 'date'
                    }
                })}"></th:block>
            </div>
            <!-- 次回更新・講習予定日 -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '次回更新・講習予定日',
                        'id': 'op-renewalDate',
                        'name': 'renewal-date',
                        'key': 'renewalDate',
                        'type': 'date'
                    }
                })}"></th:block>
            </div>
            <!-- 資格番号 -->
            <div class="form-row" th:if="${opPrivate}">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '資格番号',
                        'id': 'op-certificateNumber',
                        'name': 'certificate-number',
                        'key': 'certificateNumber',
                        'type': 'text'
                    }
                })}"></th:block>
            </div>
            <!-- 備考 -->
            <div class="form-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    {
                        'text': '備考',
                        'id': 'op-remarks',
                        'name': 'remarks',
                        'key': 'remarks',
                        'type': 'text'
                    }
                })}"></th:block>
            </div>
        </div>
        <details>
            <summary>変更履歴</summary>
            <div id="operation-history"></div>
        </details>
        <section th:if="${opPrivate}" id="operation-attachments">
            <h3>証明書・整備書類</h3>
            <p>保存済みの記録にPDF・画像を追加できます。訂正前の書類も保管します。</p>
            <input type="file" id="operation-file" accept="application/pdf,image/jpeg,image/png,image/gif" multiple data-mobile-write>
            <button type="button" id="operation-upload" class="normal-btn" data-mobile-write>書類を追加</button>
            <div id="operation-files"></div>
        </section>
        <button id="operation-delete" type="button" class="normal-btn" data-mobile-write>この登録を無効にする</button>
    </div>
</th:block>
