<th:block th:fragment="form01Fragment()">
    <div id="dispatch-member-form-list" class="dialog-content" data-enterfocus="dispatch-member-form">
        <!-- 現在の乗務員 -->
        <div class="form-parts form-row">
            <label>乗務員</label>
            <div id="dispatch-member-current-list"></div>
        </div>
        <div class="dispatch-member-divider"></div>
        <!-- 乗務員追加 -->
        <div class="form-parts form-row">
            <label>追加</label>
            <div class="dispatch-member-add-row">
                <select id="dispatch-member-candidate" class="normal-select"></select>
                <select id="dispatch-member-add-role"  class="normal-select">
                    <option value="1">担当</option>
                    <option value="2">助手</option>
                </select>
                <button type="button" id="dispatch-member-add-button" class="normal-btn">追加</button>
            </div>
        </div>
    </div>
    <!-- 乗務員1行 -->
    <template id="dispatch-member-row-template">
        <div class="dispatch-member-form-row" data-member-row>
            <span data-field="employeeName"></span>
            <select class="normal-select" data-field="role">
                <option value="1">担当</option>
                <option value="2">助手</option>
            </select>
            <!-- <button type="button" class="normal-btn" data-member-remove>削除</button> -->
            <button type="button" class="img-btn" data-member-remove title="削除">
                <img src="/icons/close.png" alt="削除">
            </button>
        </div>
    </template>
</th:block>
