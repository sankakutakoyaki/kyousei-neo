<header th:fragment="header01Fragment()"
        id="header-01"
        class="page-input-header dispatch-header-grid">

    <th:block th:replace="~{
        fragments/components/box
        :: inputBoxFragment(${
            {
                'text':'日付',
                'id':'dispatch-work-date',
                'name':'work-date',
                'type':'date',
                'default':'today',
                'action':'reload-board'
            }
        })
    }"></th:block>
    <th:block th:replace="~{
        fragments/components/box
        :: selectBoxFragment(${
            {
                'text':'営業所',
                'id':'dispatch-office',
                'name':'office-id',
                'combo':'officeComboList',
                'top':'-----',
                'loginOffice':true,
                'action':'reload-board'
            }
        })
    }"></th:block>
    <th:block th:replace="~{
        fragments/components/box
        :: selectBoxFragment(${
            {
                'text':'区分',
                'id':'dispatch-category',
                'name':'dispatch-category',
                'combo':'dispatchCategoryComboList',
                'action':'reload-board'
            }
        })
    }"></th:block>

    <select id="dispatch-add-vehicle" class="normal-select">
        <option value="">車両を選択</option>
    </select>

    <div class="form-parts">
        <label></label>
        <button type="button" class="normal-btn" data-action="add-daily-crew" data-action-lock="true">追加</button>
    </div>
</header>
