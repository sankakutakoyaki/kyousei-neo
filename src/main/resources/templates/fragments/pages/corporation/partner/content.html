<main th:fragment="content"
        class="normal-body"
        data-page="/js/pages/corporation/partner/partnerPage.js"
        data-css="/css/pages/corporation/partner.css">
    <div class="tab-area">
        <ul class="tab-menu">
            <li class="tab-menu-item is-active" data-action="tab" data-group="partner-tabs" data-tab="tab-01">施工店</li>
            <li class="tab-menu-item" data-action="tab" data-group="partner-tabs" data-tab="tab-02">担当者</li>
        </ul>
        <div class="tab-panel is-show" id="tab-01" data-tab-content="partner-tabs">
            <div class="table-area" data-controller="partnerCompany">
                <header th:replace="~{fragments/pages/corporation/partner/header :: header01Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-01', 'table-01')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-01')}"></footer>
            </div>
        </div>
        <div class="tab-panel" id="tab-02" data-tab-content="partner-tabs">
            <div class="table-area" data-controller="partnerEmployee">
                <header th:replace="~{fragments/pages/corporation/partner/header :: header02Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-02', 'table-02')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-02')}"></footer>
            </div>
        </div>
    </div>
    <div id="form-dialog-area">
        <form id="form-01" class="form-dialog none" data-controller="partnerCompany" data-key="company-id">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '施工店登録'} })}"></header>
                <section th:replace="~{fragments/pages/corporation/partner/form :: form01Fragment()}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ { 'footerId':'form-footer-01' } })}"></footer>
            </div>
        </form>
        <form id="form-02" class="form-dialog none" data-controller="partnerEmployee" data-key="employee-id">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '担当者登録'} })}"></header>
                <section th:replace="~{fragments/pages/corporation/partner/form :: form02Fragment()}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ { 'footerId':'form-footer-02' } })}"></footer>
            </div>
        </form>
    </div>
    <div id="msg-dialog-area">
        <div th:replace="~{fragments/dialog/content :: messageFragment}"></div>
    </div>
</main>
