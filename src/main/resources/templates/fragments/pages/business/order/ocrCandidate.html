<th:block th:fragment="formFragment()">
    <section class="dialog-content order-ocr-candidate-fields">
        <div class="form-row"><label>氏名<input id="ocr-customer-name" class="normal-input"></label></div>
        <div class="form-row ocr-contact-date">
            <label>配送工事日<input id="ocr-requested-date" type="date" class="normal-input" aria-describedby="ocr-requested-date-hint"><small id="ocr-requested-date-hint" hidden></small></label>
            <label>連絡先<input id="ocr-mobile-phone" class="normal-input"></label>        
        </div>
        <div class="form-row ocr-postal-address" data-resolve="postal">
            <label class="ocr-postal-field">郵便番号<input id="ocr-postal-code" name="postal-code" class="normal-input" type="text" data-type="postal" data-resolve-id="true" inputmode="numeric" placeholder="123-4567" maxlength="8"></label>
            <label class="ocr-address-field">住所<input id="ocr-address" name="full-address" type="text" class="normal-input"></label>
        </div>

        <div class="form-row"><label>備考<textarea id="ocr-contact-note" class="normal-textarea"></textarea></label></div>
        <p>配送工事日は年を含めて確認してください。空欄は未定として登録します。</p>
        <fieldset class="ocr-detail-group"><legend>商品</legend>
            <div class="ocr-detail-table ocr-item-table">
                <div class="ocr-detail-header" aria-hidden="true"><span>商品名</span><span>型番</span><span>数量</span><span></span></div>
                <div id="ocr-item-rows"></div>
            </div>
            <button id="ocr-add-item" type="button" class="img-btn ocr-detail-add" aria-label="商品を追加" title="商品を追加"><img src="/icons/add.png" alt=""><span>追加</span></button>
        </fieldset>
        <fieldset class="ocr-detail-group"><legend>作業項目（リサイクル運搬など）</legend>
            <div class="ocr-detail-table ocr-work-table">
                <div class="ocr-detail-header" aria-hidden="true"><span>作業名</span><span>数量</span><span>単価</span><span></span></div>
                <div id="ocr-work-rows"></div>
            </div>
            <button id="ocr-add-work" type="button" class="img-btn ocr-detail-add" aria-label="作業を追加" title="作業を追加"><img src="/icons/add.png" alt=""><span>追加</span></button>
        </fieldset>
        <p>商品・作業の数量を確認してください。作業単価が空欄の場合は0円で登録します。</p>
    </section>
</th:block>
