<main th:fragment="content"
        class="normal-body"
        data-page="/js/pages/business/recycle/recyclePage.js"
        data-css="/css/pages/business/recycle.css">
    <div class="tab-area">
        <ul class="tab-menu">
            <li class="tab-menu-item is-active" data-action="tab" data-group="recycle-tabs" data-tab="tab-01">一覧</li>
            <li class="tab-menu-item" data-action="tab" data-group="recycle-tabs" data-tab="tab-02">使用</li>
            <li class="tab-menu-item" data-action="tab" data-group="recycle-tabs" data-tab="tab-03">引渡</li>
            <li class="tab-menu-item" data-action="tab" data-group="recycle-tabs" data-tab="tab-04">発送</li>
            <li class="tab-menu-item" data-action="tab" data-group="recycle-tabs" data-tab="tab-05">ロス</li>
        </ul>
        <div class="tab-panel is-show" id="tab-01" data-tab-content="recycle-tabs">
            <div class="table-area" data-controller="recycleList" data-sync-group="recycle">
                <header th:replace="~{fragments/pages/business/recycle/header :: header01Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-01', 'table-01')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-01')}"></footer>
            </div>
        </div>
        <div class="tab-panel" id="tab-02" data-tab-content="recycle-tabs">
            <div class="table-area" data-controller="recycleUse" data-sync-group="recycle">
                <header th:replace="~{fragments/pages/business/recycle/header :: header02Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-02', 'table-02')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-02')}"></footer>
            </div>
        </div>
        <div class="tab-panel" id="tab-03" data-tab-content="recycle-tabs">
            <div class="table-area" data-controller="recycleDelivery" data-sync-group="recycle">
                <header th:replace="~{fragments/pages/business/recycle/header :: header03Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-03', 'table-03')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-03')}"></footer>
            </div>
        </div>
        <div class="tab-panel" id="tab-04" data-tab-content="recycle-tabs">
            <div class="table-area" data-controller="recycleShipping" data-sync-group="recycle">
                <header th:replace="~{fragments/pages/business/recycle/header :: header04Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-04', 'table-04')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-04')}"></footer>
            </div>
        </div>
        <div class="tab-panel" id="tab-05" data-tab-content="recycle-tabs">
            <div class="table-area" data-controller="recycleLoss" data-sync-group="recycle">
                <header th:replace="~{fragments/pages/business/recycle/header :: header05Fragment()}"></header>
                <section th:replace="~{fragments/table/body :: normalFragment('table-header-05', 'table-05')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-05')}"></footer>
            </div>
        </div>
    </div>
    <div id="form-dialog-area">
        <form id="form-01" class="form-dialog none" data-controller="recycleList" data-sync-group="recycle" data-key="recycle-id">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '編集'} })}"></header>
                <section th:replace="~{fragments/pages/business/recycle/form :: form01Fragment()}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ { 'footerId':'form-footer-01' } })}"></footer>
            </div>
        </form>
        <form id="form-02" class="form-dialog none" data-controller="recycleList" data-sync-group="recycle" data-key="recycle-id" data-bulk="true">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '一括編集'} })}"></header>
                <section th:replace="~{fragments/pages/business/recycle/form :: form02Fragment()}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ { 'footerId':'form-footer-02' } })}"></footer>
            </div>
        </form>
    </div>
    <div id="msg-dialog-area">
        <div th:replace="~{fragments/dialog/content :: messageFragment}"></div>
    </div>
</main>
