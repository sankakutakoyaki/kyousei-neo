<th:block th:fragment="form01Fragment()">
    <div class="dialog-content" data-enterfocus="form-01">
        <!-- お問合せ管理票番号 -->
        <div class="form-row" data-resolve="recycle">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text':'お問合せ管理票番号',
                    'id':'recycle-number01',
                    'name':'recycle-number',
                    'validate':'recycle',
                    'enter-validate':true,
                    'error-message':'リサイクル券番号は13桁です',
                    'index': 1
                }}
            )}"></th:block>
        </div>
        <!-- 会社名 -->
        <div class="form-row" data-resolve="client" >
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                { 
                    'text': '小売業者',
                    'id':'company01',
                    'name': 'company-id', 
                    'combo': 'clientComboList',
                    'top': '-----',
                    'key': 'company-id',
                    'resolveName':true,
                    'index': 2,
                    'link': 'office01'
                }}
            )}"></th:block>
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text':'支店名', 
                    'id':'office01',
                    'name': 'office-id',
                    'combo': 'officeComboList',
                    'top': '-----',
                    'key':'office-id',
                    'resolveName':true,
                    'parent': 'company01',
                    'linkDefault': 'empty'
                }}
            )}"></th:block>
        </div>
        <!-- 品目 -->
        <div class="form-row" data-resolve="item-code" data-enterfocus="code-area">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text':'コード',
                    'id':'item-code01',
                    'name':'item-code',
                    'resolveId':true,
                    'index':3,
                    'submit':'none'
                }}
            )}"></th:block>
            <th:block th:replace="~{fragments/components/box :: selectBoxFragment(${
                {
                    'text':'品目', 
                    'id':'item-name01', 
                    'name':'item-name',
                    'resolveName':true,
                    'combo': 'recycleItemComboList',
                    'top': '-----',
                    'key':'item-id',
                    'fillKey':'item-code',
                    'submit':'dataset',
                    'submitKey':'parent'
                }}
            )}"></th:block>
        </div>
        <!-- 製造業者等名 -->
        <div class="form-row"
                data-resolve="query"
                data-query-id="recycleMakerList"
                data-param-builder="makerParams"
                data-id-key="code"
                data-name-key="abbrName"
                data-value-key="recycleMakerId">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text':'コード',
                    'id':'maker-code01',
                    'name':'maker-code',
                    'resolveId':true,
                    'submit':'none',
                    'index':4
                }}
            )}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                {
                    'text':'製造業者等名', 
                    'id':'maker-name01', 
                    'name':'maker-name',
                    'resolveName':true,
                    'submit':'none',
                    'disabled':true
                }}
            )}"></th:block>
            <input
                type="hidden"
                data-role="hidden-id"
                name="maker-id"
                data-key="maker-id">
        </div>
        <!-- 日付 -->
        <div class="form-row">
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                { 
                    'text':'使用日',
                    'id':'use-date01',
                    'name':'use-date',
                    'type':'date',
                    'action':'date-arrow',
                    'index': 5
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                { 
                    'text':'引渡日',
                    'id':'delivery-date01',
                    'name':'delivery-date',
                    'type':'date',
                    'action':'date-arrow',
                    'index': 6
                }
            })}"></th:block>
            <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                { 
                    'text':'発想日',
                    'id':'shipping-date01',
                    'name':'shipping-date',
                    'type':'date',
                    'action':'date-arrow',
                    'index': 7
                }
            })}"></th:block>
        </div>
    </div>
</th:block>
