<th:block th:fragment="buttons">
    <div class="myorder-result-actions">
        <button th:each="type : ${T(com.kyouseipro.neo.common.enums.code.WorkResultType).values()}" th:if="${type.reportable}"
                type="button" class="normal-btn frameless" data-action="report-work-result"
                th:attr="data-result-type=${type.name()}" th:text="${type.label}"></button>
    </div>
</th:block>
