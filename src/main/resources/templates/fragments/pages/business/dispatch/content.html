<main th:fragment="content" class="normal-body dispatch-page" data-page="/js/pages/business/dispatch/dispatchPage.js" data-css="/css/pages/business/dispatch.css"
    th:attr="data-dispatch-manager=${dispatchManager}">
    <div class="tab-area">
        <ul class="tab-menu"><li class="tab-menu-item is-active" data-action="tab" data-group="dispatch-tabs" data-tab="dispatch-list-panel">一覧</li></ul>
        <div class="tab-panel is-show" id="dispatch-list-panel" data-tab-content="dispatch-tabs">
            <div class="table-area dispatch-main-table">
                <header th:replace="~{fragments/pages/business/dispatch/header :: headerFragment}"></header>
                <p class="dispatch-guide">配送・工事は受注の訪問日・時間を共用します。スマホでの編集は管理権限を持つ方のみ利用できます。</p>
                <section th:replace="~{fragments/table/body :: normalFragment('dispatch-table-header', 'dispatch-results')}"></section>
                <footer th:replace="~{fragments/table/footer :: datetimeFragment('dispatch-status')}"></footer>
            </div>
        </div>
    </div>
    <div id="form-dialog-area">
        <form id="dispatch-form" class="form-dialog none" data-controller="dispatch" data-key="order-id">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title':'配送・工事担当の割り当て'} })}"></header>
                <section th:replace="~{fragments/pages/business/dispatch/form :: formFragment}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ {'footerId':'dispatch-footer', 'submitText':'保存', 'cancelText':'閉じる'} })}"></footer>
            </div>
        </form>
    </div>
    <div id="msg-dialog-area"><div th:replace="~{fragments/dialog/content :: messageFragment}"></div></div>
</main>
