<main
    th:fragment="content"
    class="normal-body"
    data-page="/js/pages/operations/employeeshift/employeeShiftPage.js"
    data-css="/css/pages/operations/employeeshift.css">

    <div
        id="employee-shift-page"
        class="table-area"
        data-controller="employeeShift">
        <header class="page-input-header">
            <div class="flex-area from-row">
                <th:block th:replace="~{fragments/components/box :: inputBoxFragment(${
                    { 
                        'id': 'shift-month',
                        'text': '対象月', 
                        'name': 'shift-month', 
                        'type': 'month', 
                        'index': 1
                    }
                })}"></th:block>
                <th:block
                    th:replace="~{fragments/components/box :: selectBoxFragment(${
                        {
                            'text':'営業所',
                            'id':'shift-office',
                            'name':'office-id',
                            'combo':'officeComboList',
                            'top':'-----',
                            'loginOffice':true
                        }
                    })}">
                </th:block>
                <th:block
                    th:replace="~{fragments/components/box :: selectBoxFragment(${
                        {
                            'text':'業務区分',
                            'id':'shift-work-category',
                            'name':'work-category-id',
                            'combo':'employeeWorkCategoryComboList',
                            'top':'-----'
                        }
                    })}">
                </th:block>
                <div class="form-parts">
                    <label></label>
                    <button
                        type="button"
                        class="normal-btn"
                        id="shift-special-btn"
                        data-action="open-special-shift">
                        勤務登録
                    </button>
                </div>
                <div class="form-parts">
                    <label></label>
                    <button type="button" class="normal-btn" id="shift-save-btn" disabled>保存</button>
                </div>
            </div>
        </header>
        <!-- スマホ用の週移動 -->
        <div id="shift-week-navigation" class="shift-week-navigation">
            <button type="button" class="img-btn" data-action="previous-week" aria-label="前の週"><img src="/icons/prev.png"></button>
            <span id="shift-week-period"></span>
            <button type="button" class="img-btn" data-action="next-week" aria-label="次の週"><img src="/icons/next.png"></button>
        </div>
        <div class="table-wrapper">
            <table class="normal-table shift-month-table">
                <thead id="shift-table-header"></thead>
                <tbody id="shift-table-body" class="scroll-area"></tbody>
            </table>
        </div>
    </div>
    <!-- 応援勤務登録 -->
    <div id="form-dialog-area">
        <form id="shift-support-form"
            class="form-dialog none"
            data-controller="employeeShift">
            <div class="dialog-main">
                <header th:replace="~{fragments/dialog/header :: headerFragment(${ {'title': '勤務登録'} })}"></header>
                <section th:replace="~{fragments/pages/management/employeeshift/form :: supportFormFragment()}"></section>
                <footer th:replace="~{fragments/dialog/footer :: footerFragment(${ {'footerId': 'shift-support-footer'} })}"></footer>
            </div>
        </form>
    </div>
</main>
