<main th:fragment="content"
        class="normal-body"
        data-page="/js/pages/management/timeworksPage.js"
        data-css="/css/pages/management/timeworks.css">
    <div class="tab-area">
        <ul class="tab-menu">
            <li class="tab-menu-item is-active" data-action="tab" data-group="timeworks-tabs" data-tab="tab-01">勤怠</li>
            <li class="tab-menu-item" sec:authorize="hasAnyAuthority('APPROLE_admin', 'APPROLE_master', 'APPROLE_leader')"
                data-action="tab" data-group="timeworks-tabs" data-tab="tab-02">出退勤管理</li>
        </ul>
        <div class="tab-panel is-show" id="tab-01" data-tab-content="timeworks-tabs">
            <div class="timeworks-area">
                <section class="stamp-area" aria-labelledby="stamp-title">
                    <h2 id="stamp-title">打刻</h2>
                    <div class="stamp-clock">
                        <time id="stamp-date"></time>
                        <time id="stamp-time"></time>
                    </div>
                    <div class="stamp-employee stamp-desktop-fields">
                        <label for="stamp-identifier">社員ID／コード</label>
                        <input id="stamp-identifier" type="text" autocomplete="off">
                        <label for="stamp-user-name">氏名</label>
                        <input id="stamp-user-name" type="text" readonly tabindex="-1">
                    </div>
                    <div class="stamp-actions">
                        <button type="button" class="normal-btn stamp-button start" data-stamp-type="START" disabled>出勤</button>
                        <button type="button" class="normal-btn stamp-button end" data-stamp-type="END" disabled>退勤</button>
                    </div>
                    <p class="stamp-note stamp-desktop-fields">ID／コードを入力してEnterキーを押してください。</p>
                </section>
                <div class="table-area" data-controller="timeworks">
                    <section th:replace="~{fragments/table/body :: normalFragment('table-header-01', 'table-01')}"></section>
                    <footer th:replace="~{fragments/table/footer :: datetimeFragment('footer-01')}"></footer>
                </div>                
            </div>
        </div>
        <div class="tab-panel" id="tab-02" data-tab-content="timeworks-tabs"
             sec:authorize="hasAnyAuthority('APPROLE_admin', 'APPROLE_master', 'APPROLE_leader')">
            <section class="timework-management" aria-labelledby="management-title">
                <h2 id="management-title">出退勤管理</h2>
                <div class="management-toolbar">
                    <label>対象月
                        <input id="management-month" type="month">
                    </label>
                    <label>締め日
                        <select id="management-closing-type">
                            <option value="FIFTEENTH">15日締め</option>
                            <option value="MONTH_END">月末締め</option>
                        </select>
                    </label>
                    <label>営業所
                        <select id="management-office"></select>
                    </label>
                    <label>従業員
                        <select id="management-employee"></select>
                    </label>
                    <button id="management-search" type="button" class="normal-btn">検索</button>
                    <button id="management-csv" type="button" class="normal-btn">CSVダウンロード</button>
                </div>
                <p id="management-period" class="management-period"></p>
                <div class="management-table-wrapper">
                    <table class="management-table normal-table">
                        <thead>
                            <tr name="table-header"><th>勤務日</th><th>社員ID</th><th>氏名</th><th>営業所</th><th>出勤（打刻）</th><th>出勤（修正）</th><th>退勤（打刻）</th><th>退勤（修正）</th><th>翌日</th></tr>
                        </thead>
                        <tbody id="management-list" class="scroll-area"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <div id="msg-dialog-area">
        <div th:replace="~{fragments/dialog/content :: messageFragment}"></div>
    </div>
</main>
