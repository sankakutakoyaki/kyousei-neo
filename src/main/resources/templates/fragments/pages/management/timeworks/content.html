<main th:fragment="content"
      class="normal-body"
      data-page="/js/pages/management/timeworks/timeworksPage.js"
      data-css="/css/pages/management/timeworks.css">

    <div class="tab-area">

        <ul class="tab-menu">

            <li class="tab-menu-item is-active"
                data-action="tab"
                data-group="timeworks-tabs"
                data-tab="tab-01">
                勤怠
            </li>

            <li class="tab-menu-item"
                sec:authorize="hasAnyAuthority(
                    'APPROLE_admin',
                    'APPROLE_master',
                    'APPROLE_leader'
                )"
                data-action="tab"
                data-group="timeworks-tabs"
                data-tab="tab-02">
                出退勤管理
            </li>

        </ul>


        <!-- 打刻 -->
        <div class="tab-panel is-show"
             id="tab-01"
             data-tab-content="timeworks-tabs">

            <div class="timeworks-area">

                <section
                    class="stamp-area"
                    aria-labelledby="stamp-title"
                    data-controller="timeworks">

                    <h2 id="stamp-title">打刻</h2>

                    <div class="stamp-clock">
                        <time id="stamp-date"></time>
                        <time id="stamp-time"></time>
                    </div>


                    <div
                        class="stamp-employee stamp-desktop-fields"
                        data-controller="timeworks"
                        data-action="employee-resolved"
                        data-event="resolved"
                        data-resolve="api"
                        data-resolve-url="/api/timeworks/employee"
                        data-param-key="identifier"
                        data-name-key="fullName"
                        data-resolve-enter="true">

                        <label for="stamp-identifier">
                            社員ID／コード
                        </label>

                        <input
                            id="stamp-identifier"
                            type="text"
                            autocomplete="off"
                            data-resolve-id="true">

                        <label for="stamp-user-name">
                            氏名
                        </label>

                        <input
                            id="stamp-user-name"
                            type="text"
                            readonly
                            tabindex="-1"
                            data-resolve-name="true">

                    </div>


                    <div class="stamp-actions">

                        <button
                            type="button"
                            class="normal-btn stamp-button start"
                            data-action="stamp"
                            data-action-managed="false"
                            data-stamp-type="START"
                            disabled>
                            出勤
                        </button>

                        <button
                            type="button"
                            class="normal-btn stamp-button end"
                            data-action="stamp"
                            data-action-managed="false"
                            data-stamp-type="END"
                            disabled>
                            退勤
                        </button>

                    </div>


                    <dl class="stamp-records"
                        aria-live="polite"
                        aria-label="出退勤時刻">

                        <div>
                            <dt>出勤時刻</dt>
                            <dd id="stamp-start-record">—</dd>
                        </div>

                        <div>
                            <dt>退勤時刻</dt>
                            <dd id="stamp-end-record">—</dd>
                        </div>

                    </dl>

                    <p class="stamp-note stamp-desktop-fields">
                        ID／コードを入力してEnterキーを押してください。
                    </p>

                </section>


                <div class="table-area"
                     data-controller="timeworks">

                    <section th:replace="~{
                        fragments/table/body
                        :: normalFragment(
                            'table-header-01',
                            'table-01'
                        )
                    }"></section>

                    <footer th:replace="~{
                        fragments/table/footer
                        :: datetimeFragment('footer-01')
                    }"></footer>

                </div>

            </div>
        </div>


        <!-- 出退勤管理 -->
        <div class="tab-panel"
             id="tab-02"
             data-tab-content="timeworks-tabs"
             data-controller="timeworks"
             sec:authorize="hasAnyAuthority(
                'APPROLE_admin',
                'APPROLE_master',
                'APPROLE_leader'
             )">

            <section class="timework-management"
                     aria-labelledby="management-title">

                <h2 id="management-title">
                    出退勤管理
                </h2>


                <div class="management-toolbar">

                    <th:block th:replace="~{
                        fragments/components/box
                        :: inputBoxFragment(${
                            {
                                'text':'対象月',
                                'id':'management-month',
                                'name':'management-month',
                                'type':'month',
                                'default':'current-month',
                                'action':'search-management'
                            }
                        })
                    }">
                    </th:block>


                    <th:block th:replace="~{
                        fragments/components/box
                        :: selectBoxFragment(${
                            {
                                'text':'締め日',
                                'id':'management-closing-type',
                                'name':'management-closing-type',
                                'combo':'closingTypeComboList',
                                'action':'search-management'
                            }
                        })
                    }">
                    </th:block>


                    <th:block th:replace="~{
                        fragments/components/box
                        :: selectBoxFragment(${
                            {
                                'text':'営業所',
                                'id':'management-office',
                                'name':'office-id',
                                'combo':'officeComboList',
                                'top':'すべて',
                                'loginOffice':true,
                                'action':'load-management-employees'
                            }
                        })
                    }">
                    </th:block>


                    <th:block th:replace="~{
                        fragments/components/box
                        :: selectBoxFragment(${
                            {
                                'text':'従業員',
                                'id':'management-employee',
                                'name':'employee-id',
                                'top':'すべて',
                                'action':'search-management'
                            }
                        })
                    }">
                    </th:block>

                    <div class="img-btn"
                        data-action="download">
                        <img src="/icons/download.png">
                        <span>取得</span>
                    </div>
                </div>


                <p id="management-period"
                   class="management-period">
                </p>


                <div class="management-table-wrapper">

                    <table class="management-table normal-table">

                        <thead>
                            <tr name="table-header">
                                <th>勤務日</th>
                                <th>社員ID</th>
                                <th>氏名</th>
                                <th>営業所</th>
                                <th>出勤（打刻）</th>
                                <th>出勤（修正）</th>
                                <th>退勤（打刻）</th>
                                <th>退勤（修正）</th>
                                <th>翌日</th>
                            </tr>
                        </thead>

                        <tbody
                            id="management-list"
                            class="scroll-area">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </div>

</main>
