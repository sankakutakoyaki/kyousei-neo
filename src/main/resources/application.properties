spring.application.name=neo
server.servlet.session.timeout=2h

#File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# GPU読取サービスを導入するまでは従来のTesseract OCRを利用する。
order.ai.enabled=false
# GPU導入後に起動する伝票読取サービスの接続先。
order.ai.extraction-url=http://127.0.0.1:18080/v1/document-extractions
order.ai.model-name=qwen2.5vl:3b

# Mail
spring.mail.host=sv6105.xserver.jp
spring.mail.port=465
spring.mail.username=system@kyouseibin.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true